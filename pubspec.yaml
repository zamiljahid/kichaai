name: kichaai
description: Kichaai - Bangladesh Service Marketplace
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_animate: ^4.5.0
  dio: ^5.7.0
  shared_preferences: ^2.3.0
  provider: ^6.1.0
  geolocator: ^13.0.0
  video_player: ^2.9.2
  image_picker: ^1.1.2
  # Map for mess/housing search — Google Maps (key in web/index.html + AndroidManifest).
  google_maps_flutter: ^2.9.0
  # Pin to 6.x — 7.x has breaking API changes we haven't migrated to.
  google_sign_in: ^6.2.1
  # Opens the Google Meet link directly (Meet app if installed, else browser) — lawyer
  # consultation "join" buttons used to only offer copy-the-link-and-paste-it-yourself.
  url_launcher: ^6.3.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  # Loud, alarm-style local notification for new job offers / scheduled
  # consultation reminders — on Android this rides the device's own
  # ALARM-stream sound (no bundled asset needed); on iOS there is no
  # equivalent "use the system alarm sound" API, so this is only the
  # background/killed-app tray notification there (default system sound).
  flutter_local_notifications: ^18.0.1
  # Foreground continuous "ringing" loop (assets/sounds/alarm_ring.wav — a
  # synthesized two-tone siren, not a licensed/fetched sound file) played
  # while a job-offer alert is on screen. Set to iOS AVAudioSession
  # "playback" category, which plays through the mute/silent switch without
  # needing Apple's special Critical Alerts entitlement.
  audioplayers: ^6.1.0
  # On-device speech-to-text for the lawyer AI chat's mic input — audio never leaves the
  # device, only the transcript is sent to our backend (important given how sensitive legal
  # conversations are). Uses Android SpeechRecognizer / iOS SFSpeechRecognizer.
  speech_to_text: ^7.0.0
  # Meal Group invite sharing — opens the OS share sheet (WhatsApp/SMS/etc.) with the
  # group's invite code + link; no backend SMS/WhatsApp gateway needed for this.
  share_plus: ^10.1.2
  # Meal Group one-tap join links — parses an incoming kichaai://meal/join/<code>
  # custom-scheme link when the app is already installed (Phase 1; real https
  # Android App Links / iOS Universal Links need domain verification, out of scope here).
  app_links: ^6.3.2
  # The animated bottom nav from ki_chai: the selected item's icon dissolves and
  # its label slides up under a moving indicator. Pinned to the same 0.0.x the
  # source app uses.
  flashy_tab_bar2: ^0.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/services/
    - assets/sounds/
  # Bundled locally instead of relying on GoogleFonts' runtime CDN fetch — on Flutter Web that
  # fetch depends on the VIEWER's browser reaching fonts.googleapis.com at paint time; any
  # network restriction there (corporate firewall, DNS block, offline dev) makes every Bengali
  # glyph app-wide render as tofu ("????"), not just wherever you happen to be looking.
  fonts:
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf

# Generates android/ios launcher icons from assets/images/logo.png — run
# `flutter pub run flutter_launcher_icons` after replacing the source file.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  remove_alpha_ios: true
