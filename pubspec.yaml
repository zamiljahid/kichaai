name: kichaai
description: Kichaai - Bangladesh Service Marketplace
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  dio: ^5.7.0
  shared_preferences: ^2.3.0
  provider: ^6.1.0
  geolocator: ^13.0.0
  video_player: ^2.9.2
  image_picker: ^1.1.2
  # Map for mess/housing search — Google Maps (key in web/index.html + AndroidManifest).
  google_maps_flutter: ^2.9.0
  # Pin to 6.x — 7.x has breaking API changes we haven't migrated to.
  google_sign_in: ^6.2.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/services/
